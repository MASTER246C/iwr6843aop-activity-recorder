/* Original SYS/BIOS sensing-task configuration. */
var BIOS = xdc.useModule('ti.sysbios.BIOS');
var Task = xdc.useModule('ti.sysbios.knl.Task');
var Clock = xdc.useModule('ti.sysbios.knl.Clock');
var Hwi = xdc.useModule('ti.sysbios.family.arm.v7r.vim.Hwi');
var Memory = xdc.useModule('xdc.runtime.Memory');
var HeapMem = xdc.useModule('ti.sysbios.heaps.HeapMem');
var System = xdc.useModule('xdc.runtime.System');
var SysMin = xdc.useModule('xdc.runtime.SysMin');
xdc.useModule('ti.sysbios.knl.Semaphore');
System.SupportProxy = SysMin;
SysMin.bufSize = 512;
BIOS.taskEnabled = true;
BIOS.includeXdcRuntime = true;
BIOS.libType = BIOS.LibType_Custom;
BIOS.customCCOpts += ' --enum_type=int ';
Clock.tickPeriod = 1000;
Hwi.fiqStackSize = 1024;
Hwi.fiqStackSection = '.fiq_stack';
Program.stack = 2048;
Program.sectMap['.vecs'] = 'VECTORS';
Program.sectMap['.fiq_stack'] = 'DATA_RAM';
var heap = new HeapMem.Params();
heap.size = 49152;
heap.sectionName = 'sensing_heap';
Memory.defaultHeapInstance = HeapMem.create(heap);

xdc.useModule('ti.sysbios.gates.GateMutex');
